# Publication JSR — via OIDC (aucun secret à gérer) : lier le dépôt GitHub au
# paquet sur jsr.io (@streemkit/forge → Settings → Link GitHub repository).
# Déclenchement : release GitHub publiée, ou manuel (workflow_dispatch).
# Penser à bumper "version" dans deno.json avant de publier.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC — requis par `deno publish` vers JSR

jobs:
  publish:
    name: Publish to JSR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      # Filet de sécurité : on ne publie jamais du rouge.
      - name: Tests
        run: deno test -A engine admin

      - name: Publish
        run: deno publish
